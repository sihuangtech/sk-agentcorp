[project]
name = "sk-agentcorp"
version = "0.1.0"
description = "SK AgentCorp — The Next-Gen Zero-Human Company Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SK AgentCorp Contributors"},
]
keywords = ["ai", "agents", "autonomous", "company", "langgraph", "crewai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-anthropic>=1.7.2",
    "langchain-ollama>=1.1.0",
    "apscheduler>=3.11.3",
    "python-socketio>=5.17.0",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "greenlet>=3.5.6",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
]

[project.scripts]
sk-agentcorp = "cli.main:app"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
